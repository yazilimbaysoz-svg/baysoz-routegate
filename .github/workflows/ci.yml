# Baysöz Labs <baysozlabs@proton.me> — baysoz-routegate
name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ATTRIBUTION: "Baysöz Labs <baysozlabs@proton.me>"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e

      - name: Install project and test tooling
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest ruff semgrep

      - name: Tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check --select E,F,W,S,B .

      - name: Security scan
        run: uv run semgrep --config p/default --error .
