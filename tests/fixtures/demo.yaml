# Baysöz Labs <baysozlabs@proton.me> — baysoz-routegate
apiVersion: v1
kind: Namespace
metadata:
  name: edge
  labels:
    tier: edge
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: edge
spec:
  gatewayClassName: baysöz-lb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.example.com"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              tier: edge
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canonical
  namespace: edge
  creationTimestamp: "2026-01-01T00:00:00Z"
spec:
  parentRefs:
    - name: public
  hostnames:
    - shop.example.com
    - "*.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: catalog-svc
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: legacy-wide
  namespace: edge
  creationTimestamp: "2026-02-01T00:00:00Z"
spec:
  parentRefs:
    - name: public
  hostnames:
    - "*.example.com"
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/health
      backendRefs:
        - name: legacy-svc
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: checkout
  namespace: edge
  creationTimestamp: "2026-03-01T00:00:00Z"
spec:
  parentRefs:
    - name: public
  hostnames:
    - shop.example.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/cart
          headers:
            - name: x-tier
              value: gold
      backendRefs:
        - name: checkout-svc
          port: 8080
